<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié | FraudGuard AI</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/auth.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
    <!-- Background Layers -->
    <div class="auth-bg-layer layer-1"></div>
    <div class="auth-bg-layer layer-2"></div>
    
    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <a href="{{ url_for('home') }}" class="auth-logo">
                    <span class="brand-icon">⚡</span>
                    <span class="brand-text">FRAUD</span>
                    <span class="brand-accent">GUARD</span>
                </a>
                <h1 class="auth-title">MOT DE PASSE OUBLIÉ</h1>
                <p class="auth-subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>
            </div>
            
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="auth-messages">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            <!-- Forgot Password Form -->
            <form id="forgotPasswordForm" method="POST" action="{{ url_for('forgot_password') }}" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-wrapper">
                        <i class="bi bi-envelope input-icon"></i>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            class="form-input" 
                            placeholder="votre@email.com"
                            required
                            autocomplete="email"
                        >
                    </div>
                    <span class="error-message" id="emailError"></span>
                </div>
                
                <button type="submit" class="btn-auth-primary" id="submitBtn">
                    <span>ENVOYER LE LIEN</span>
                    <i class="bi bi-send"></i>
                </button>
            </form>
            
            <!-- Footer -->
            <div class="auth-footer">
                <p><a href="{{ url_for('login') }}"><i class="bi bi-arrow-left"></i> Retour à la connexion</a></p>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth JS -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
